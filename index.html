<script type="module">
  import { db, ref, push, set, onValue, remove } from './firebase-config.js';

  const productsRef = ref(db, 'products');

  // Convert and compress file to Base64 string directly
  function compressImageToBase64(file, maxWidth = 500) {
    return new Promise((resolve, reject) => {
      if (!file) return resolve('');
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = (err) => reject(err);
      };
      reader.onerror = (err) => reject(err);
    });
  }

  // Example implementation when saving a product:
  async function handleAddProduct(event) {
    event.preventDefault();
    
    const fileInput = document.getElementById('productImageInput');
    const file = fileInput ? fileInput.files[0] : null;

    let base64Image = '';
    if (file) {
      base64Image = await compressImageToBase64(file);
    }

    const newProduct = {
      name: document.getElementById('productName').value,
      price: document.getElementById('productPrice').value,
      img: base64Image, // Directly stores image string in database
      createdAt: Date.now()
    };

    const newRef = push(productsRef);
    await set(newRef, newProduct);
    alert('Product added successfully!');
  }
</script>
