<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kareem Store | Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        body {
            background: #FAF5ED;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 20px;
            color: #2D2926;
        }

        .section-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            border: 1px solid #EFE8DE;
            margin-bottom: 30px;
        }

        .btn-luxury {
            background: #2D2926;
            color: white;
            border-radius: 50px;
            font-weight: 600;
        }

        .btn-luxury:hover {
            background: #8C6D53;
            color: white;
        }

        #drop-zone {
            border: 2px dashed #DCD4C8;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            background: #FDFBF7;
            cursor: pointer;
        }

        .variant-row {
            background: #FDFBF7;
            border: 1px solid #EFE8DE;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <h2 class="fw-bold mb-4">Manager Dashboard</h2>

        <div class="row">
            <div class="col-lg-5">
                <div class="section-card">
                    <h4 class="fw-bold mb-4">Product Management</h4>
                    <div class="row g-3">
                        <input type="hidden" id="editing-id">

                        <div class="col-12">
                            <label class="small fw-bold">Product Name</label>
                            <input type="text" id="p-name" class="form-control" placeholder="Product name">
                        </div>

                        <div class="col-6">
                            <label class="small fw-bold">Category</label>
                            <input type="text" id="p-category" class="form-control" placeholder="Cable, Charger, etc.">
                        </div>

                        <div class="col-6">
                            <label class="small fw-bold">Phone Type / Model</label>
                            <input type="text" id="p-phonetype" class="form-control" placeholder="iPhone 15, S24">
                        </div>

                        <div class="col-4">
                            <label class="small fw-bold">Price (EGP)</label>
                            <input type="number" id="p-price" class="form-control" placeholder="1500">
                        </div>

                        <div class="col-4">
                            <label class="small fw-bold">Sale Price</label>
                            <input type="number" id="p-discount" class="form-control" placeholder="1200">
                        </div>

                        <div class="col-4">
                            <label class="small fw-bold">Stock</label>
                            <input type="number" id="p-stock" class="form-control" value="5">
                        </div>

                        <!-- Multi-Color Variant Builder -->
                        <div class="col-12 border-top pt-3 mt-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="small fw-bold mb-0">Color Variants (Specific Images)</label>
                                <button type="button" class="btn btn-sm btn-outline-dark rounded-pill" onclick="addVariantRow()">+ Add Color</button>
                            </div>
                            <div id="variants-container"></div>
                        </div>

                        <div class="col-12">
                            <label class="small fw-bold">Main Product Default Image</label>
                            <div id="drop-zone">
                                <p id="upload-status" class="mb-0 text-muted small">
                                    <i class="bi bi-cloud-arrow-up fs-4 d-block mb-1"></i> Upload Main Image
                                </p>
                                <input type="file" id="p-file" hidden accept="image/*">
                                <input type="hidden" id="p-img-url">
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="small fw-bold">Details & Specs</label>
                            <textarea id="p-desc" class="form-control" rows="2" placeholder="Product details..."></textarea>
                        </div>

                        <div class="col-12">
                            <button class="btn btn-luxury w-100 py-3 mt-2" onclick="saveProduct()">SAVE TO SHOP</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="section-card">
                    <h4 class="fw-bold mb-4">Live Inventory</h4>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <tbody id="inventory-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, ref, push, set, onValue, remove, storage, storageRef, uploadBytes, getDownloadURL } from './firebase-config.js';

        const fileInput = document.getElementById('p-file');
        const dropZone = document.getElementById('drop-zone');
        const hiddenImgUrl = document.getElementById('p-img-url');

        dropZone.onclick = () => fileInput.click();

        // Client-Side Canvas Image Compression (#2)
        function compressImage(file, maxWidth = 1000) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.82);
                    };
                };
            });
        }

        // Firebase Storage Upload (#1)
        async function uploadFileToCloud(file) {
            const compressed = await compressImage(file);
            const fileRef = storageRef(storage, `products/${Date.now()}_${file.name}`);
            const snapshot = await uploadBytes(fileRef, compressed);
            return await getDownloadURL(snapshot.ref);
        }

        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('upload-status').innerText = "Compressing & Uploading to Firebase...";
            const url = await uploadFileToCloud(file);
            hiddenImgUrl.value = url;
            document.getElementById('upload-status').innerText = "Uploaded!";
        };

        // Variant Rows Logic
        window.addVariantRow = (color = "", img = "") => {
            const container = document.getElementById('variants-container');
            const row = document.createElement('div');
            row.className = "variant-row d-flex gap-2 align-items-center";
            row.innerHTML = `
                <input type="text" class="form-control form-control-sm variant-color" placeholder="Color (e.g. Blue)" value="${color}">
                <input type="text" class="form-control form-control-sm variant-img" placeholder="Image URL" value="${img}">
                <input type="file" class="d-none variant-file" accept="image/*">
                <button type="button" class="btn btn-sm btn-outline-secondary text-nowrap" onclick="this.previousElementSibling.click()">Upload</button>
                <button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">X</button>
            `;

            row.querySelector('.variant-file').onchange = async (e) => {
                const f = e.target.files[0];
                if (!f) return;
                const url = await uploadFileToCloud(f);
                row.querySelector('.variant-img').value = url;
            };

            container.appendChild(row);
        };

        window.saveProduct = async () => {
            const id = document.getElementById('editing-id').value;
            const name = document.getElementById('p-name').value;
            const category = document.getElementById('p-category').value || "Other";
            const phoneType = document.getElementById('p-phonetype').value || "";
            const price = document.getElementById('p-price').value;
            const discount = document.getElementById('p-discount').value;
            const stock = document.getElementById('p-stock').value || 5;
            const description = document.getElementById('p-desc').value;
            const mainImg = hiddenImgUrl.value;

            // Collect Variants
            const variantRows = document.querySelectorAll('.variant-row');
            const variants = [];
            variantRows.forEach(r => {
                const c = r.querySelector('.variant-color').value.trim();
                const i = r.querySelector('.variant-img').value.trim();
                if (c) variants.push({ color: c, img: i || mainImg });
            });

            if (!name || !price || !mainImg) return alert("Please complete name, price, and main image!");

            const data = {
                name, category, phoneType,
                price: Number(price),
                discountPrice: discount ? Number(discount) : null,
                stock: Number(stock),
                description: description || "",
                img: mainImg,
                variants
            };

            if (id) await set(ref(db, 'products/' + id), data);
            else await push(ref(db, 'products'), data);

            alert("Saved successfully!");
            location.reload();
        };

        onValue(ref(db, 'products'), (snap) => {
            const data = snap.val();
            const list = document.getElementById('inventory-list');
            list.innerHTML = "";
            for (let id in data) {
                const p = data[id];
                list.innerHTML += `
                    <tr>
                        <td><img src="${p.img}" style="width:40px; height:40px; object-fit:cover; border-radius:8px;"></td>
                        <td><div class="fw-bold small">${p.name}</div><small class="text-muted">${p.price} EGP</small></td>
                        <td class="text-end"><button class="btn btn-sm btn-danger" onclick="deleteProduct('${id}')"><i class="bi bi-trash"></i></button></td>
                    </tr>`;
            }
        });

        window.deleteProduct = (id) => { if (confirm("Delete product?")) remove(ref(db, 'products/' + id)); };
    </script>
</body>

</html>
